<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur d’Images IA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>
    
    <header>
        <h1>Générateur d’Images IA</h1>
        <p>Crée des images avec l’intelligence artificielle</p>
    </header>
    <div class="generator">
        <input id="prompt" type="text" placeholder="Décris ton image">
        <button id="generate">Générer</button>
        <img id="result" src="" alt="Image générée">
    </div>

    <main>
        <textarea id="prompt" placeholder="Décris l’image que tu veux créer..."></textarea>
        <button id="generateBtn">Générer l’image</button>

        <div id="resultContainer">
            <img id="resultImage" src="" alt="">
            <button id="downloadBtn">Télécharger</button>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
